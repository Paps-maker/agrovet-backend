spring.application.name=demo
server.port=${PORT:8081}

# MySQL Connection Config (Supports Railway environment variables with fallbacks)
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/agrovetdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQLUSER:agro_user}
spring.datasource.password=${MYSQLPASSWORD:your_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Auto Table Creation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect